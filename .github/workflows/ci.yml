name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_USER: mma
          POSTGRES_PASSWORD: mma
          POSTGRES_DB: mma_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mma -d mma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # pnpm comes from corepack in the next step, so setup-node can't cache its store.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Mobile packages match Expo SDK 57
        # Offline, expo compares against the pins of the installed expo package (bundledNativeModules.json). Online, it
        # wants the newest SDK patch, which pnpm's minimum release age can hold back for a day.
        run: pnpm --filter mobile exec expo install --check
        env:
          EXPO_OFFLINE: "1"
      - run: pnpm knip:production
      - name: Build without a database, then run the end-to-end tests against it
        run: pnpm --filter web test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"
